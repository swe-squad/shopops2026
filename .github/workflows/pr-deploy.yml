name: PR Deploy

# Comment on a pull request:
#   /deploy                -> deploy every service changed in the PR to its develop environment
#   /deploy ping-api ...   -> deploy only those services
# The develop app keeps that build until the next push/merge to develop or another /deploy.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  prepare:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/deploy') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      services: ${{ steps.pr.outputs.services }}
    steps:
      - name: Resolve PR head and services
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}")

          # Never build fork code with deploy secrets
          if [[ $(jq -r '.head.repo.full_name' <<<"${pr_json}") != "${GITHUB_REPOSITORY}" ]]; then
            echo "::error::PR #${PR} comes from a fork; /deploy only works for branches in this repo"
            exit 1
          fi
          if [[ $(jq -r '.state' <<<"${pr_json}") != "open" ]]; then
            echo "::error::PR #${PR} is not open"
            exit 1
          fi
          sha=$(jq -r '.head.sha' <<<"${pr_json}")

          # Services named after /deploy, else every service the PR touches
          requested=$(head -n1 <<<"${BODY}" | sed -E 's#^/deploy[[:space:]]*##' | tr -s ' \t,' '\n' | grep -E '^[a-z0-9-]+$' || true)
          if [[ -z "${requested}" ]]; then
            requested=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" -q '.[].filename' \
              | sed -nE 's#^services/([^/]+)/.*#\1#p' | sort -u)
          fi

          # Keep only real services at the PR head
          services='[]'
          for s in ${requested}; do
            if gh api --silent "repos/${GITHUB_REPOSITORY}/contents/services/${s}/service.json?ref=${sha}" 2>/dev/null; then
              services=$(jq -c --arg s "${s}" '. + [$s]' <<<"${services}")
            else
              echo "::warning::'${s}' is not a service at ${sha::7}, skipping"
            fi
          done
          if [[ "${services}" == "[]" ]]; then
            echo "::error::No services to deploy (PR changes none under services/, or names are wrong)"
            exit 1
          fi

          echo "Deploying ${services} at ${sha::7}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "services=${services}" >> "$GITHUB_OUTPUT"
          gh api --silent -X POST "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" -f content=rocket

  deploy:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    name: ${{ matrix.service }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: ${{ matrix.service }}
      ref: ${{ needs.prepare.outputs.sha }}
      environment: develop
      tag: pr-${{ github.event.issue.number }}
    secrets: inherit

  report:
    needs: [prepare, deploy]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment result on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          SHA: ${{ needs.prepare.outputs.sha }}
          SERVICES: ${{ needs.prepare.outputs.services }}
          RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "${RESULT}" == "success" ]]; then icon="✅"; else icon="❌"; fi
          list=$(jq -r 'map("`" + . + "`") | join(", ")' <<<"${SERVICES}")
          gh pr comment "${PR}" --repo "${GITHUB_REPOSITORY}" \
            --body "${icon} Deploy ${list} @ \`${SHA::7}\` lên **develop**: ${RESULT} — [xem run](${RUN_URL})"
