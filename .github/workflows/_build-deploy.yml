name: Build and Deploy (reusable)

# CI -> build services/<service> -> push ghcr.io/<owner>/<service> -> deploy to CapRover.
# CapRover secrets for every service live in the shared GitHub environment codex-sea-dev / codex-sea-prod:
# CAPROVER_SERVER plus <SERVICE>_<ENV>_APP_NAME and <SERVICE>_<ENV>_CAPROVER_TOKEN, where SERVICE is
# upper-cased with - -> _ and ENV is DEV or PROD, e.g. PING_API_DEV_APP_NAME. Repo-level secrets work too.
# Callers must pass `secrets: inherit`.
on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      ref:
        description: Commit SHA to build
        type: string
        required: true
      environment:
        description: develop or production
        type: string
        required: true
      tag:
        description: Moving image tag in addition to the short SHA (latest-develop, pr-12, ...)
        type: string
        required: true

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      service: ${{ inputs.service }}
      ref: ${{ inputs.ref }}

  build-and-deploy:
    needs: ci
    permissions:
      contents: read
      packages: write

    environment:
      name: ${{ inputs.environment == 'production' && 'codex-sea-prod' || 'codex-sea-dev' }}

    # One deploy at a time per service + environment, whether it came from a push or a PR comment
    concurrency:
      group: deploy-${{ inputs.service }}-${{ inputs.environment }}
      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare image tags and build args
        id: meta
        env:
          SERVICE: ${{ inputs.service }}
          TAG: ${{ inputs.tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          # Repo + environment variables; service.json buildArgVars picks which ones become build args
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${SERVICE}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "MOVING_TAG=${TAG//\//-}" >> "$GITHUB_ENV"
          case "${ENVIRONMENT}" in
            develop) env_key=DEV ;;
            production) env_key=PROD ;;
            *) echo "::error::Unknown environment '${ENVIRONMENT}'"; exit 1 ;;
          esac
          prefix="${SERVICE^^}"
          echo "secret_prefix=${prefix//-/_}_${env_key}" >> "$GITHUB_OUTPUT"
          {
            echo "build_args<<__EOF__"
            jq -r '.buildArgVars // [] | .[]' "services/${SERVICE}/service.json" | while read -r name; do
              echo "${name}=$(jq -r --arg n "${name}" '.[$n] // ""' <<<"${VARS_JSON}")"
            done
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Check CapRover secrets
        env:
          PREFIX: ${{ steps.meta.outputs.secret_prefix }}
          HAS_SERVER: ${{ secrets.CAPROVER_SERVER != '' }}
          HAS_APP: ${{ secrets[format('{0}_APP_NAME', steps.meta.outputs.secret_prefix)] != '' }}
          HAS_TOKEN: ${{ secrets[format('{0}_CAPROVER_TOKEN', steps.meta.outputs.secret_prefix)] != '' }}
        run: |
          missing=()
          [[ "${HAS_SERVER}" == "true" ]] || missing+=(CAPROVER_SERVER)
          [[ "${HAS_APP}" == "true" ]] || missing+=("${PREFIX}_APP_NAME")
          [[ "${HAS_TOKEN}" == "true" ]] || missing+=("${PREFIX}_CAPROVER_TOKEN")
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          file: services/${{ inputs.service }}/Dockerfile
          push: true
          build-args: ${{ steps.meta.outputs.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE_REPO }}:${{ env.MOVING_TAG }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Deploy image to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets[format('{0}_APP_NAME', steps.meta.outputs.secret_prefix)] }}
          token: ${{ secrets[format('{0}_CAPROVER_TOKEN', steps.meta.outputs.secret_prefix)] }}
          image: ${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}
