server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-src ${BROWSER_APP_URL} ${CHAT_APP_URL}; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /client-config.json {
        default_type application/json;
        expires -1;
        return 200 '{"browser_url":"${BROWSER_APP_URL}","chat_url":"${CHAT_APP_URL}"}';
    }
    location /api/ { return 404; }
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
