server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/chat/ {
        resolver 127.0.0.11 valid=10s;
        set $chat_upstream "${SHOPOPS_CHAT_API_URL}";
        proxy_pass $chat_upstream;
        proxy_buffering off;
        # Forward SSE buffering control through the outer CapRover proxy.
        proxy_pass_header X-Accel-Buffering;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 5s;
        gzip off;
    }
    location = /api/operations/navigation {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream "${API_URL}";
        proxy_pass $api_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /api/ { return 404; }
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' ${WORKSPACE_VIEWER_URL}" always;
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
