map $http_x_forwarded_proto $mock_protocol {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/mock/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $mock_protocol;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /api/operations/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream "${API_URL}";
        proxy_pass $api_upstream;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        return 404;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' ${WORKSPACE_VIEWER_URL}" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
